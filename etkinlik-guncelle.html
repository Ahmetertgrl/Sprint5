<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etkinlik Güncelle</title>
  <link rel="stylesheet" href="css/2416501029.css">
  <!-- Ekleme sayfası ile aynı JS modülünü kullanır -->
  <script type="module" src="js/event-form.js"></script>
</head>
<body>

  <header>
    <h1>Etkinlik Güncelle</h1>
    <nav>
      <a href="index.html">Ana Sayfa</a>
      <a href="etkinlikler.html">Etkinlikler</a>
      <a href="etkinlik-ekle.html">Ekle</a>
    </nav>
  </header>

  <main>
    <p style="margin-bottom: 1rem; font-size: 0.9rem; color: #64748b;">Alanlar mevcut etkinliğin bilgileriyle dolu gelir. Bu sprintte form veri güncellemez.</p>

    <!-- data-mode="guncelle" işareti JS'in burayı tanımasını sağlar -->
    <form id="etkinlik-formu" data-mode="guncelle" novalidate>
      <div class="form-group">
        <label for="etkinlik-adi">Etkinlik Adı *</label>
        <input type="text" id="etkinlik-adi" name="etkinlik_adi">
        <span id="etkinlik_adi-hata" class="hata-mesaji" style="color: #e11d48; font-size: 0.8rem;"></span>
      </div>

      <div class="form-group">
        <label for="kategori">Kategori *</label>
        <select id="kategori" name="kategori">
          <option value="">Seçiniz</option>
          <option value="Seminer">Seminer</option>
          <option value="Atölye">Atölye</option>
          <option value="Söyleşi">Söyleşi</option>
        </select>
        <span id="kategori-hata" class="hata-mesaji" style="color: #e11d48; font-size: 0.8rem;"></span>
      </div>

      <div class="form-group">
        <label for="tarih">Tarih *</label>
        <input type="date" id="tarih" name="tarih">
        <span id="tarih-hata" class="hata-mesaji" style="color: #e11d48; font-size: 0.8rem;"></span>
      </div>

      <div class="form-group">
        <label for="saat">Saat *</label>
        <input type="time" id="saat" name="saat">
        <span id="saat-hata" class="hata-mesaji" style="color: #e11d48; font-size: 0.8rem;"></span>
      </div>

      <div class="form-group">
        <label for="yer">Yer *</label>
        <input type="text" id="yer" name="yer">
        <span id="yer-hata" class="hata-mesaji" style="color: #e11d48; font-size: 0.8rem;"></span>
      </div>

      <div class="form-group">
        <label for="kontenjan">Kontenjan</label>
        <input type="number" id="kontenjan" name="kontenjan">
        <span id="kontenjan-hata" class="hata-mesaji" style="color: #e11d48; font-size: 0.8rem;"></span>
      </div>

      <div class="form-group">
        <label for="aciklama">Açıklama</label>
        <textarea id="aciklama" name="aciklama" rows="4"></textarea>
      </div>

      <button type="submit">Güncelle</button>

      <div id="form-mesaj"></div>
    </form>
  </main>

  <footer>
    <p>Ahmet Turhan Ertuğrul · 2416501029</p>
  </footer>

</body>
</html>
